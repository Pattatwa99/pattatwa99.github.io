baseURL = "https://pattatwa99.github.io/"
title = "Isaac Fischer"
paginate = 5
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[minify]
  disableXML = false
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Isaac Fischer"
  description = "Software Developer • Builder • Tech Explorer"
  keywords = ["Isaac Fischer", "Developer", "Portfolio", "Blog", "Tech", "Python", "Web Development"]
  author = "Isaac Fischer"
  defaultTheme = "auto" # auto, dark, light
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  mainSections = ["posts", "projects"]

  [params.profileMode]
    enabled = true
    title = "Isaac Fischer"
    subtitle = "Software Developer • Builder • Tech Explorer"
    imageUrl = "forg.gif"
    imageTitle = "Isaac Fischer"
    imageWidth = 160
    imageHeight = 160
    buttons = [
      { name = "Projects", url = "projects/" },
      { name = "Posts", url = "posts/" },
      { name = "About", url = "about/" },
      { name = "Search", url = "search/" }
    ]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Pattatwa99"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:isaacfischer08@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-32x32.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon-180x180.png"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "projects/"
    weight = 10

  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "posts/"
    weight = 20

  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "archives/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "search/"
    weight = 40

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 50
