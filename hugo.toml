baseURL = "https://pattatwa99.github.io/"
title = "Isaac F"
paginate = 8
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[minify]
  disableXML = false
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Isaac F"
  description = "Computing Enthusiast — Personal Blog."
  keywords = ["Isaac F", "Computing", "Blog", "Systems", "Linux"]
  author = "Isaac F"
  images = ["IMG_1747.JPEG"]
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Isaac F"
    Content = """**Computing Enthusiast**

Personal blog and technical notebook."""
    imageUrl = "IMG_1747.JPEG"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Isaac F"

  [params.profileMode]
    enabled = false
    title = "Isaac F"
    subtitle = "Computing Enthusiast — Personal Blog."
    imageUrl = "IMG_1747.JPEG"
    imageTitle = "Isaac F"
    imageWidth = 150
    imageHeight = 150

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Pattatwa99"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:donpotato@netherportal3.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-32x32.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon-180x180.png"
    safari_pinned_tab = "favicon.svg"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "posts/"
    weight = 10

  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "archives/"
    weight = 20

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "search/"
    weight = 30

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 40
