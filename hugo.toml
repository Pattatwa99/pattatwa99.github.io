baseURL = "https://pattatwa99.github.io/"
title = "Isaac F"
paginate = 8
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[minify]
  disableXML = false
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Isaac F"
  description = "Computing Enthusiast — Systems, Linux, and technical notes."
  keywords = ["Isaac F", "Computing", "Systems", "Linux", "C", "Python", "Blog"]
  author = "Isaac F"
  defaultTheme = "dark" # Dark mode default per design brief
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  mainSections = ["writing"] # Writing displays directly on homepage

  [params.homeInfoParams]
    Title = "Isaac F"
    Content = """**Computing Enthusiast**

Interested in the relationship between hardware and software, from low-level systems to applications.

This site serves as a technical notebook and blog documenting experiments, systems programming, Linux, and things learned along the way."""

  [params.profileMode]
    enabled = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Pattatwa99"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:donpotato@netherportal3.com"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-32x32.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon-180x180.png"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "writing"
    name = "Writing"
    url = "writing/"
    weight = 10

  [[menu.main]]
    identifier = "notes"
    name = "Notes"
    url = "notes/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "search/"
    weight = 40
